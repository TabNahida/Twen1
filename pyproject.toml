[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "twen"
version = "0.1.0"
description = "Resumable Qwen3.5 dense-FFN-to-MoE transfer toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Twen1 contributors" }]
dependencies = [
  "numpy>=2.0",
  "packaging>=24.0",
  "fsspec[http]>=2024.6",
  "pyarrow==23.0.1",
  "PyYAML>=6.0",
  "safetensors>=0.5",
  "torch>=2.6",
  "transformers>=5.8.1",
  "huggingface-hub>=0.36",
  "tqdm>=4.67",
]

[project.optional-dependencies]
download-modelscope = ["modelscope>=1.24"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "wheel==0.46.3",
]
serve = ["vllm>=0.21"]

[project.scripts]
twen = "twen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twen"]

[tool.hatch.build.targets.wheel.force-include]
"src/twen/web_static/index.html" = "twen/web_static/index.html"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "training: contains optimizer steps and must only be run explicitly by the user",
  "gpu: requires CUDA and must only be run explicitly by the user",
  "network: accesses the network through the configured proxy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"src/twen/modeling/modules.py" = ["F822"]
