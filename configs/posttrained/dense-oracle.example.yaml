schema_version: 1
run_id: posttrained-dense-v1
track: posttrained
stage: dense-oracle

sources:
  backbone: &backbone
    model_id: Qwen/Qwen3.5-0.8B
    revision: REPLACE_WITH_COMMIT_SHA
    local_path: artifacts/models/qwen3.5-0.8b
    manifest_sha256: REPLACE_WITH_64_HEX_DIGEST
  donor: &donor
    model_id: Qwen/Qwen3.5-9B
    revision: REPLACE_WITH_COMMIT_SHA
    local_path: artifacts/models/qwen3.5-9b
    manifest_sha256: REPLACE_WITH_64_HEX_DIGEST
  teacher: *donor
  tokenizer: *backbone
  folded_experts_path: null
  folded_experts_sha256: null

architecture:
  expert_initialization: donor
  random_expert_seed: 1701
  layer_map_path: artifacts/calibration/posttrained/layer_map.json
  channel_map_path: artifacts/calibration/posttrained/channel_map.json
  adapter_init_path: artifacts/calibration/posttrained/adapters.safetensors

data:
  manifest_path: artifacts/data/posttrained/manifest.json
  manifest_sha256: REPLACE_WITH_64_HEX_DIGEST
  teacher_kd_manifest_path: artifacts/data/posttrained-kd/manifest.json
  teacher_kd_manifest_sha256: REPLACE_WITH_64_HEX_DIGEST

losses:
  # Project coefficient; Qwen3.5 does not publish an official MTP loss weight.
  mtp: 0.0
  dense_oracle: 0.0
  router_supervision: 0.0
  load_balance: 0.0
  router_z: 0.0
  dense_oracle_batch_fraction: 0.0

optimizer:
  max_tokens: 100000000

checkpoint:
  output_dir: runs/posttrained-dense-v1

runtime:
  compile_streaming_loss: true
  activation_checkpoint_layer_count: null
  teacher_cpu_offload: false
  activation_checkpointing_on_alignment_only: false
